research_task:
  description: >
    User ye job dhoond raha hai: "{job_title}" in "{location}".
    User ne ye filters bhi specify kiye hain: "{filters_text}".
    Is job title se related current, relevant listings dhoondo — search_jobs
    tool call karte waqt job_type, remote_type, experience_level,
    salary_range, aur posted_date arguments ko in filters ke mutabiq set
    karo (jo filter specify nahi hua uske liye default 'Any' / 'Any time' /
    empty string use karo).

    BOHOT ZAROORI RULE — Tool ke output ko HUBAHU (exactly as-is) copy karo:
    - Tool ka output tumhe [REAL DATA — via SerpAPI Google Jobs] ya
      [DEMO DATA — NOT REAL LISTINGS] label ke sath deta hai — apne final
      answer ki bilkul pehli line mein YEHI EXACT label copy karo. Kabhi bhi
      is label ko khud se change mat karo (jaise agar tool ne REAL DATA diya
      hai to usay kabhi DEMO likh kar mat dikhao, aur na hi iska ulta).
    - Sirf wahi companies, job titles, requirements, salary, aur posting
      URLs use karo jo TOOL NE ASAL MEIN return kiye hain — apni taraf se
      koi naya/fake company, listing, ya URL kabhi mat banao (hallucinate
      mat karo), chahe tool ne kam listings (jaise sirf 1 ya 2) hi kyun na
      di hon. Agar tool sirf 1 real listing deta hai, to sirf wahi 1 listing
      apne output mein do — 3-5 tak pohanchane ke liye extra fake listings
      HARGIZ mat jodo.
    - Har real listing ke sath uska ASAL POSTING URL/LINK bhi copy karo jo
      tool ne diya tha, taake candidate khud verify kar sake ke job real
      hai.

    Write entirely in English.
  expected_output: >
    A clear disclaimer at the top — copied exactly from the tool's own
    label (REAL or DEMO) — a note on which filters were applied, followed
    by however many relevant job listings the tool actually returned
    (could be 1 to 5 — never invent extra ones to pad the count), each with
    company name, key requirements, and the exact posting URL/link from the
    tool.
  agent: job_researcher

analysis_task:
  description: >
    Job Researcher ki di hui listings ko deeply analyze karo. Common
    required skills, experience level, aur hidden/implied requirements
    nikalo jo saari listings mein common hain. Write entirely in English.
  expected_output: >
    A structured summary: required technical skills, soft skills,
    experience level, and what the candidate should highlight
  agent: job_analyzer
  context:
    - research_task

resume_task:
  description: >
    User ka background/original CV ye hai: "{user_background}".
    Job Analyzer ke analysis ke hisab se, ye CV ko REWRITE karo — ek poori
    updated version banao jo job requirements se match kare. Apna output
    is EXACT structure mein do:

    ## ORIGINAL CV SUMMARY
    (original CV ka bohot chota summary, 2-3 lines)

    ## CHANGES MADE
    (bullet list — kya specific cheezein change/add ki gayi hain aur kyun)

    ## UPDATED CV
    (poori naya, rewritten CV text — professional summary + tailored bullet
    points, ATS-friendly, ready to use)

    Write entirely in English.
  expected_output: >
    A response with three clearly marked sections: ORIGINAL CV SUMMARY,
    CHANGES MADE, and UPDATED CV (the full rewritten resume text)
  agent: resume_agent
  context:
    - analysis_task

cover_letter_task:
  description: >
    Resume Agent ki UPDATED CV (nahi ke original) aur job analysis ko
    combine karke, ek personalized cover letter likho (250-300 words) jo
    user ke background ko target job requirements se connect kare.
    Write entirely in English.
  expected_output: >
    A complete, professional cover letter in English
  agent: cover_letter_agent
  context:
    - analysis_task
    - resume_task

interview_prep_task:
  description: >
    Job analysis ke hisab se, is role ke liye 5 likely interview questions
    aur har ek ka ek strong sample answer approach (STAR method use karte
    hue) tayyar karo. Write entirely in English.
  expected_output: >
    5 interview questions, each with an answer strategy
  agent: interview_prep_agent
  context:
    - analysis_task

application_task:
  description: >
    Research Task ki listings mein se SABSE ZYADA MATCHING job chuno (job
    analysis ke hisab se). Us ek job ke liye ek complete application DRAFT
    tayyar karo is structure mein:

    ## TARGET JOB
    (company name, job title, aur posting URL jo tumne research mein diya tha)

    ## APPLICATION SUMMARY
    (2-3 sentences — kyun ye candidate is job ke liye sahi hai)

    ## RESUME TO ATTACH
    (Resume Agent ki UPDATED CV se reference — sirf "see updated resume above")

    ## COVER LETTER TO ATTACH
    (Cover Letter Agent ke letter se reference — sirf "see cover letter above")

    ## NEXT STEPS FOR CANDIDATE (IMPORTANT)
    Clearly likho: "This is a DRAFT only. Please review everything above
    carefully, fill in your personal contact details, and submit this
    application YOURSELF through the official job posting link. This
    system does not and will not submit applications automatically."

    Write entirely in English. Tum kabhi ye mat kaho ke application
    "submit ho gayi" — sirf draft tayyar karo.
  expected_output: >
    A complete application draft with target job, summary, references to
    the resume/cover letter, and a clear human-review reminder
  agent: application_agent
  context:
    - research_task
    - analysis_task
    - resume_task
    - cover_letter_task

review_task:
  description: >
    Poori package (resume, cover letter, interview prep, application draft)
    ko review karo. Check karo kya sab kuch job requirements se consistent
    hai, aur final improvement suggestions do agar koi cheez missing ho.
    Write entirely in English.
  expected_output: >
    A final quality report: what's good, what should be improved, and an
    overall readiness score (out of 10)
  agent: reviewer
  context:
    - resume_task
    - cover_letter_task
    - interview_prep_task
    - application_task